<!DOCTYPE html>
<html>
  <head>
    <title>Wellbeing Blocker</title>
    <style>
      body {
        font-family: "Segoe UI", Roboto, sans-serif;
        width: 260px;
        padding: 15px;
        margin: 0;
        background: #f4f6f8;
        color: #333;
      }

      h3 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        color: #222;
      }

      #sectionsContainer {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        padding: 12px;
        margin-bottom: 12px;
        max-height: 160px;
        overflow-y: auto;
      }

      #sectionsContainer label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 8px;
        transition: background 0.2s;
        cursor: pointer;
      }

      #sectionsContainer label:hover {
        background: #f0f2f5;
      }

      input[type="checkbox"] {
        accent-color: #0078d7;
        transform: scale(1.1);
      }

      button {
        display: block;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, #0078d7, #005bb5);
        color: white;
        transition: transform 0.1s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      }

      button:active {
        transform: translateY(0);
        box-shadow: none;
      }

      /* Scrollbar dopieszczony */
      #sectionsContainer::-webkit-scrollbar {
        width: 6px;
      }

      #sectionsContainer::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 3px;
      }

      #sectionsContainer::-webkit-scrollbar-thumb:hover {
        background: #aaa;
      }
    </style>
  </head>
  <body>
    <h3>Blocked pages</h3>
    <div id="sectionsContainer"></div>
    <script src="popup.js"></script>
  </body>
</html>
